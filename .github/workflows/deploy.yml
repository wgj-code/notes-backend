name: Deploy to Supabase Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  db-push:
    if: ${{ vars.ENABLE_DB_PUSH == 'true' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: |
          # Use printf to safely pass password with special characters
          export SUPABASE_DB_PASSWORD=$(printf '%s' "$SUPABASE_DB_PASSWORD")
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Push migrations
        run: supabase db push --linked
      - name: Deploy functions
        run: |
          supabase functions deploy hello --no-verify-jwt
          supabase functions deploy tts --no-verify-jwt
          supabase functions deploy logs-ingest --no-verify-jwt
